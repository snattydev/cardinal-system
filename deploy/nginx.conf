# Cardinal System — nginx configuration for cardinal-frontend container
# Runs inside the cardinal pod, proxies /api and /ws to cardinal-backend
# on localhost:8787 (shared pod network namespace).

upstream cardinal-backend {
    server localhost:8787;
}

server {
    listen 8000;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # ── API reverse proxy ──
    location /api/ {
        proxy_pass http://cardinal-backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ── WebSocket reverse proxy ──
    location /ws {
        proxy_pass http://cardinal-backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ── SPA static files ──
    location / {
        try_files $uri $uri/ /index.html;
    }
}
